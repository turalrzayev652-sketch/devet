<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c09">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dv-page" data-state="loading">
    <div class="dust" aria-hidden="true"></div>

    <section data-block="hero" class="hero">
      <svg class="hero__corner hero__corner--tl" viewBox="0 0 80 80" aria-hidden="true"><path d="M2 78V2h76M12 66V12h54M2 2l22 22M24 24h14M24 24v14"/></svg>
      <svg class="hero__corner hero__corner--tr" viewBox="0 0 80 80" aria-hidden="true"><path d="M2 78V2h76M12 66V12h54M2 2l22 22M24 24h14M24 24v14"/></svg>
      <svg class="hero__corner hero__corner--bl" viewBox="0 0 80 80" aria-hidden="true"><path d="M2 78V2h76M12 66V12h54M2 2l22 22M24 24h14M24 24v14"/></svg>
      <svg class="hero__corner hero__corner--br" viewBox="0 0 80 80" aria-hidden="true"><path d="M2 78V2h76M12 66V12h54M2 2l22 22M24 24h14M24 24v14"/></svg>

      <div class="hero__inner">
        <p class="hero__type reveal" data-bind="event.type_label"></p>
        <svg class="hero__diamond reveal" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h50M70 6h50M60 0l6 6-6 6-6-6z"/></svg>
        <p class="hero__greeting reveal" data-bind="guest.greeting"></p>
        <h1 class="hero__names reveal" data-bind="event.title_names"></h1>
        <p class="hero__invite reveal" data-bind="event.invite_sentence"></p>
        <div class="hero__when reveal">
          <span class="hero__weekday" data-bind="event.weekday"></span>
          <span class="hero__date" data-bind="event.date"></span>
          <span class="hero__time" data-bind="event.time"></span>
        </div>
        <p class="hero__venue reveal" data-bind="event.venue_name"></p>
        <p class="hero__intro reveal" data-bind="text.intro"></p>
      </div>
      <span class="hero__scroll" aria-hidden="true"></span>
    </section>

    <section data-block="countdown" class="reveal"></section>
    <section data-block="gallery" class="reveal"></section>
    <section data-block="music" class="reveal"></section>
    <section data-block="map" class="reveal"></section>
    <section data-block="table" class="reveal"></section>
    <section data-block="rsvp" class="reveal"></section>

    <footer class="closing reveal">
      <svg class="closing__mark" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h50M70 6h50M60 0l6 6-6 6-6-6z"/></svg>
      <p class="closing__text" data-bind="text.closing"></p>
      <p class="closing__hosts" data-bind="event.hosts_line"></p>
    </footer>
    <section data-block="watermark" class="wm"></section>
  </main>
  <script type="module" src="/core/invite-core.js"></script>
  <script type="module" src="motion.js"></script>
</body>
</html>
