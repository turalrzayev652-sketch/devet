<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dəvətnamə</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 18px; margin-bottom: 30px; line-height: 1.6; }
        .links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        a {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn-primary {
            background: white;
            color: #667eea;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary {
            border: 2px solid white;
            color: white;
        }
        .btn-secondary:hover {
            background: white;
            color: #667eea;
        }
        .status {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
        }
        .checkmark { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Dəvətnamə</h1>
        <p>Şəxsi rəqəmsal dəvətnamə platforması</p>

        <div class="links">
            <a href="/i/demo" class="btn-primary">Qonaq Linki</a>
            <a href="https://github.com/turalrzayev652-sketch/devet" class="btn-secondary">GitHub</a>
        </div>

        <div class="status">
            <p><span class="checkmark">✓</span> Backend: LIVE</p>
            <p><span class="checkmark">✓</span> Mobile Apps: Ready</p>
            <p><span class="checkmark">✓</span> Web: Deployed</p>
        </div>
    </div>
</body>
</html>
