<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font check — Devet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600&family=Lora:wght@500;600&family=Noto+Serif+Display:wght@500;600&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600&display=swap&subset=latin,latin-ext,cyrillic" rel="stylesheet">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #FAF7F2; color: #1F1B24; }
  h1 { font-size: 20px; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  td, th { border-bottom: 1px solid #EAE4DC; padding: 8px; text-align: left; vertical-align: top; }
  .sample { font-size: 26px; }
  .ok { color: #2F6B3F; font-weight: 600; }
  .bad { color: #9E3B34; font-weight: 600; }
  code { font-size: 12px; }
</style>
</head>
<body>
<h1>Şrift yoxlaması: Azərbaycan hərfləri + kiril</h1>
<p>Hər hərf iki fərqli ehtiyat şriftlə (serif və monospace) ölçülür. Eni fərqlənirsə, şriftdə həmin hərf yoxdur — brauzer ehtiyat şriftə keçib.</p>
<table id="results"><thead><tr><th>Şrift</th><th>Nümunə</th><th>Nəticə</th></tr></thead><tbody></tbody></table>
<script>
  // Letters the brief requires (section 2, Typography) + Turkish ı/İ + full Russian alphabet.
  const AZ = 'ƏəĞğŞşÇçÖöÜüIıİi';
  const RU = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя';
  const SAMPLE = 'Əziz Gülşən, İlqar · Ağ Saray şadlıq evi · Уважаемые гости, ёлка Щ';
  const FONTS = [
    ['Cormorant Garamond', 600], ['Playfair Display', 600], ['Lora', 600], ['Noto Serif Display', 600],
    ['Inter', 400], ['Inter', 600], ['Manrope', 400],
  ];
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const width = (font, ch) => { ctx.font = font; return ctx.measureText(ch).width; };

  function missingGlyphs(family, weight) {
    const missing = [];
    for (const ch of AZ + RU) {
      const a = width(`${weight} 48px "${family}", serif`, ch);
      const b = width(`${weight} 48px "${family}", monospace`, ch);
      if (Math.abs(a - b) > 0.01) missing.push(ch);
    }
    return missing;
  }

  async function run() {
    await Promise.all(FONTS.map(([f, w]) => document.fonts.load(`${w} 48px "${f}"`, AZ + RU)));
    await document.fonts.ready;
    const tbody = document.querySelector('#results tbody');
    const report = {};
    for (const [family, weight] of FONTS) {
      const loaded = document.fonts.check(`${weight} 48px "${family}"`, 'a');
      const missing = missingGlyphs(family, weight);
      const ok = loaded && missing.length === 0;
      report[`${family} ${weight}`] = { loaded, missing: missing.join('') };
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${family} <code>${weight}</code></td>
        <td class="sample" style="font-family:'${family}';font-weight:${weight}">${SAMPLE}</td>
        <td class="${ok ? 'ok' : 'bad'}">${!loaded ? 'yüklənmədi' : ok ? 'Hamısı var ✓' : 'Yoxdur: ' + missing.join(' ')}</td>`;
      tbody.append(tr);
    }
    window.__fontReport = report;
    document.body.dataset.done = '1';
  }
  run();
</script>
</body>
</html>
